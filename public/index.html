<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STRATUS Chatroom</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #0f0f1e 0%, #1a0033 100%);
            color: #fff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }

        .chatroom-container {
            width: 100%;
            max-width: 800px;
            height: 90vh;
            background: rgba(20, 20, 40, 0.9);
            border: 1px solid rgba(0, 212, 255, 0.3);
            border-radius: 16px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 20px 60px rgba(0, 212, 255, 0.2);
            backdrop-filter: blur(10px);
        }

        .header {
            padding: 1.5rem;
            border-bottom: 1px solid rgba(0, 212, 255, 0.2);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h1 {
            font-size: 1.5rem;
            background: linear-gradient(135deg, #00d4ff, #0099ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .status {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.85rem;
            color: rgba(255, 255, 255, 0.7);
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #00ff88;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .messages-container {
            flex: 1;
            overflow-y: auto;
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .message {
            display: flex;
            flex-direction: column;
            gap: 0.3rem;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message-header {
            display: flex;
            gap: 0.5rem;
            align-items: center;
            font-size: 0.85rem;
        }

        .message-username {
            font-weight: 700;
            font-size: 0.95rem;
        }

        .message-time {
            color: rgba(255, 255, 255, 0.4);
            font-size: 0.75rem;
        }

        .message-content {
            background: rgba(255, 255, 255, 0.05);
            padding: 0.8rem 1rem;
            border-radius: 8px;
            border-left: 3px solid;
            word-wrap: break-word;
            line-height: 1.4;
        }

        .empty-state {
            text-align: center;
            color: rgba(255, 255, 255, 0.5);
            padding: 2rem;
        }

        .input-section {
            padding: 1.5rem;
            border-top: 1px solid rgba(0, 212, 255, 0.2);
            display: flex;
            gap: 0.8rem;
        }

        .username-input,
        .message-input {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            color: #fff;
            padding: 0.8rem 1rem;
            font-size: 0.9rem;
            transition: all 0.3s ease;
        }

        .username-input {
            width: 120px;
        }

        .message-input {
            flex: 1;
        }

        .username-input:focus,
        .message-input:focus {
            outline: none;
            background: rgba(255, 255, 255, 0.15);
            border-color: rgba(0, 212, 255, 0.5);
            box-shadow: 0 0 10px rgba(0, 212, 255, 0.2);
        }

        .message-input::placeholder {
            color: rgba(255, 255, 255, 0.5);
        }

        .send-btn {
            background: linear-gradient(135deg, #00d4ff, #0099ff);
            color: #000;
            border: none;
            padding: 0.8rem 1.5rem;
            border-radius: 8px;
            font-weight: 700;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.3s ease;
            white-space: nowrap;
        }

        .send-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 10px 25px rgba(0, 212, 255, 0.4);
        }

        .send-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            pointer-events: none;
        }

        .color-picker {
            display: flex;
            gap: 0.3rem;
            margin-bottom: 0.5rem;
        }

        .color-option {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            border: 2px solid transparent;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .color-option:hover,
        .color-option.active {
            border-color: #fff;
            transform: scale(1.1);
        }

        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.05);
        }

        ::-webkit-scrollbar-thumb {
            background: rgba(0, 212, 255, 0.3);
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: rgba(0, 212, 255, 0.5);
        }
    </style>
</head>
<body>
    <div class="chatroom-container">
        <div class="header">
            <h1>🎮 STRATUS Chatroom</h1>
            <div class="status">
                <div class="status-dot" id="statusDot"></div>
                <span id="userCount">Loading...</span>
            </div>
        </div>

        <div class="messages-container" id="messagesContainer">
            <div class="empty-state">💬 No messages yet. Start the conversation!</div>
        </div>

        <div class="input-section">
            <div style="display: flex; flex-direction: column; gap: 0.5rem;">
                <div class="color-picker" id="colorPicker"></div>
                <input type="text" id="usernameInput" class="username-input" placeholder="Your name" maxlength="20">
            </div>
            <input type="text" id="messageInput" class="message-input" placeholder="Type a message..." maxlength="500">
            <button class="send-btn" id="sendBtn">Send</button>
        </div>
    </div>

    <script>
        const API_URL = window.location.origin;
        const colors = ['#00d4ff', '#00ff88', '#ff00ff', '#ffaa00', '#ff0055', '#00ffff'];
        let selectedColor = colors[0];
        let lastMessageTimestamp = 0;
        let isConnected = false;

        // Initialize color picker
        function initColorPicker() {
            const picker = document.getElementById('colorPicker');
            colors.forEach(color => {
                const btn = document.createElement('div');
                btn.className = 'color-option';
                btn.style.backgroundColor = color;
                if (color === selectedColor) btn.classList.add('active');
                btn.onclick = () => {
                    document.querySelectorAll('.color-option').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    selectedColor = color;
                };
                picker.appendChild(btn);
            });
        }

        // Get username
        function getUsername() {
            return document.getElementById('usernameInput').value.trim() || 'Anonymous';
        }

        // Format time
        function formatTime(timestamp) {
            return new Date(timestamp).toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' });
        }

        // Render messages
        function renderMessages(messages) {
            const container = document.getElementById('messagesContainer');
            
            if (messages.length === 0 && lastMessageTimestamp === 0) {
                container.innerHTML = '<div class="empty-state">💬 No messages yet. Start the conversation!</div>';
                return;
            }

            if (messages.length === 0) return;

            messages.forEach(msg => {
                if (msg.timestamp > lastMessageTimestamp) {
                    const msgEl = document.createElement('div');
                    msgEl.className = 'message';
                    msgEl.innerHTML = `
                        <div class="message-header">
                            <span class="message-username" style="color: ${msg.color}">${msg.username}</span>
                            <span class="message-time">${formatTime(msg.timestamp)}</span>
                        </div>
                        <div class="message-content" style="border-left-color: ${msg.color}">${escapeHtml(msg.message)}</div>
                    `;
                    container.appendChild(msgEl);
                    lastMessageTimestamp = msg.timestamp;
                }
            });

            // Auto-scroll to bottom
            container.scrollTop = container.scrollHeight;
        }

        // Escape HTML
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Poll for messages
        async function pollMessages() {
            try {
                const res = await fetch(`${API_URL}/api/chat?action=messages&since=${lastMessageTimestamp}`);
                const data = await res.json();
                
                if (data.messages && data.messages.length > 0) {
                    renderMessages(data.messages);
                }
                
                isConnected = true;
                updateStatus(true);
            } catch (error) {
                console.error('Poll error:', error);
                isConnected = false;
                updateStatus(false);
            }
        }

        // Update status
        function updateStatus(connected) {
            const dot = document.getElementById('statusDot');
            if (connected) {
                dot.style.background = '#00ff88';
                dot.style.animation = 'pulse 2s infinite';
            } else {
                dot.style.background = '#ff0055';
                dot.style.animation = 'none';
            }
        }

        // Get user count
        async function updateUserCount() {
            try {
                const res = await fetch(`${API_URL}/api/chat?action=status`);
                const data = await res.json();
                document.getElementById('userCount').textContent = `${data.users || 0} users online`;
            } catch (error) {
                document.getElementById('userCount').textContent = 'offline';
            }
        }

        // Send message
        async function sendMessage() {
            const username = getUsername();
            const message = document.getElementById('messageInput').value.trim();

            if (!message) return;

            document.getElementById('sendBtn').disabled = true;
            document.getElementById('messageInput').value = '';

            try {
                const res = await fetch(`${API_URL}/api/chat?action=send`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, message, color: selectedColor })
                });

                if (res.ok) {
                    const data = await res.json();
                    renderMessages([data.message]);
                }
            } catch (error) {
                console.error('Send error:', error);
            } finally {
                document.getElementById('sendBtn').disabled = false;
                document.getElementById('messageInput').focus();
            }
        }

        // Event listeners
        document.getElementById('sendBtn').onclick = sendMessage;
        document.getElementById('messageInput').onkeypress = (e) => {
            if (e.key === 'Enter') sendMessage();
        };

        // Initialize
        initColorPicker();
        pollMessages();
        updateUserCount();
        setInterval(pollMessages, 2000); // Poll every 2 seconds
        setInterval(updateUserCount, 5000); // Update user count every 5 seconds
    </script>
</body>
</html>
